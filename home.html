<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的 3D 滾動個人網站</title>
  
  <!-- 引入 Google 官方最穩定的 3D 元件核心腳本 -->
  <script type="module" src="https://googleapis.com"></script>

  <style>
    body, html {
      margin: 0; padding: 0;
      background-color: #0d0d11; color: #ffffff;
      font-family: sans-serif; overflow-x: hidden;
    }
    
    /* 背景 3D 模型固定滿版 */
    model-viewer {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh; z-index: 1;
      pointer-events: none; /* 💡 關閉滑鼠手勢，改由滾動控制 */
      --poster-color: transparent;
    }

    .scroll-container { position: relative; z-index: 2; }

    /* 建立超長網頁區塊，讓網頁有往下捲動的空間 */
    .page-section {
      height: 100vh;
      display: flex;
      align-items: center;
      padding: 0 8%;
      box-sizing: border-box;
    }

    .page-section:nth-child(even) {
      justify-content: flex-end;
    }

    .text-box {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 40px;
      border-radius: 16px;
      max-width: 400px;
    }

    h1 { margin: 0 0 15px 0; font-size: 2.5rem; color: #00fff2; }
    p { margin: 0; font-size: 1.1rem; line-height: 1.6; color: #ccc; }
  </style>
</head>
<body>

  <!-- 💡 核心修改：src="me.glb" 直接讀取你在 Blender 裡大瘦身出來的完美 3D 模型檔案 -->
  <model-viewer 
    id="my-avatar" 
    src="me.glb" 
    shadow-intensity="1" 
    environment-image="neutral"
    camera-orbit="0deg 75deg 2.5m">
  </model-viewer>

  <!-- 前景捲動內容 -->
  <div class="scroll-container">
    <section class="page-section">
      <div class="text-box">
        <h1>歡迎來到我的空間</h1>
        <p>這是我用 AI 生成並經由 Blender 優化的 3D 全身造型。試著向下滾動網頁看看？</p>
      </div>
    </section>
    
    <section class="page-section">
      <div class="text-box">
        <h1>關於我的作品</h1>
        <p>當網頁往下捲動時，背景的模型會自動轉向側面，帶出流暢的網頁互動體驗。</p>
      </div>
    </section>
    
    <section class="page-section">
      <div class="text-box">
        <h1>聯絡我</h1>
        <p>模型現在轉到了背面。不論往上或往下捲動，動態效果都會完美同步！</p>
      </div>
    </section>
  </div>

  <script>
    // 利用純網頁的原生事件監聽，去換算滾動進度並直接改變模型角度
    window.addEventListener('scroll', () => {
      const model = document.querySelector('#my-avatar');
      if (!model) return;

      const scrollTop = window.scrollY;
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      const scrollPercent = scrollTop / docHeight;
      const targetDegree = scrollPercent * 180;

      model.setAttribute('camera-orbit', `${targetDegree}deg 75deg 2.5m`);
    });
  </script>
</body>
</html>
