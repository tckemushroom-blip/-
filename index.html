<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>作品集範本</title>
  <link rel="stylesheet" href="styles.css" />
  <meta name="description" content="簡易作品集範本，請把 me.glb 放到 assets/me.glb" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.154.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="scene" aria-hidden="true"></div>

  <header class="hero">
    <div class="hero-inner"></div>
  </header>

  <main>
    <section id="overview" class="panel">
      <div class="panel-inner">
        <div class="panel-left"><h2>作品導覽</h2></div>
        <div class="panel-right">
          <p>點選下方項目快速跳轉到各區塊：</p>
          <div class="nav-grid">
            <a class="nav-button" href="#graduation">畢業專題</a>
            <a class="nav-button" href="#graphic">平面設計</a>
            <a class="nav-button" href="#photography">攝影</a>
          </div>
        </div>
      </div>
    </section>

    <section id="cheng" class="panel">
      <div class="panel-inner">
        <div class="panel-left"><h2>程宥融</h2></div>
        <div class="panel-right"><h3>畢業於: 國立臺北商業大學 創意科技與產品設計系</h3></div>
      </div>
    </section>

    <section id="graduation" class="panel">
      <div class="panel-inner">
        <div class="panel-left"><h2>畢業專題</h2></div>
        <div class="panel-right">
          <h3>LIT 瑞士國際照明獎</h3>
          <p>（在此放專題簡介或作品連結）</p>
          <h3>國科會大專生大專學生研究計畫</h3>
          <p>（在此放專題簡介或作品連結）</p>
        </div>
      </div>
    </section>

    <section id="graphic" class="panel">
      <div class="panel-inner">
        <div class="panel-left"><h2>平面設計</h2></div>
        <div class="panel-right">
          <p>（在此放平面設計作品集或連結）</p>
        </div>
      </div>
    </section>

    <section id="photography" class="panel">
      <div class="panel-inner">
        <div class="panel-left"><h2>攝影</h2></div>
        <div class="panel-right">
          <h3>產學合作</h3>
          <p>（放置合作計畫或作品）</p>
          <h3>活動快照</h3>
          <p>（活動照片範例）</p>
          <h3>人像攝影</h3>
          <p>（人像作品展示）</p>
          <h3>興趣攝影</h3>
          <p>（個人興趣作品）</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <small>© 2026 你的名字</small>
  </footer>

  <div id="model-status" aria-hidden="true" class="model-status">3D model: initializing...</div>
  <script type="module" src="script.js?v=250pct-" + Date.now() + "></script>
</body>
</html>
