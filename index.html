<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的 3D 滾動個人網站</title>
  
  <!-- 引入業界最穩定的 Three.js 核心庫與 GLTF 載入器 (全站採用 cdnjs 安全節點，防堵 CORS 阻擋) -->
  <script src="https://cloudflare.com"></script>
  <script src="https://jsdelivr.net"></script>
  <!-- 引入 Google 官方備用的 Draco 獨立解碼器插件 -->
  <script src="https://jsdelivr.net"></script>
  <!-- 引入動畫庫 GSAP -->
  <script src="https://cloudflare.com"></script>
  <script src="https://cloudflare.com"></script>

  <style>
    body, html {
      margin: 0; padding: 0;
      background-color: #0d0d11; color: #ffffff;
      font-family: sans-serif; overflow-x: hidden;
    }
    /* 讓 3D 畫布固定在背景 */
    #canvas-container {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh; z-index: 1;
    }
    .scroll-container { position: relative; z-index: 2; }
    .page-section { height: 100vh; display: flex; align-items: center; padding: 0 8%; box-sizing: border-box; }
    .page-section:nth-child(even) { justify-content: flex-end; }
    .text-box { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 40px; border-radius: 16px; max-width: 400px; }
    h1 { margin: 0 0 15px 0; font-size: 2.5rem; color: #00fff2; }
    p { margin: 0; font-size: 1.1rem; line-height: 1.6; color: #ccc; }
  </style>
</head>
<body>

  <!-- 3D 渲染畫布 -->
  <div id="canvas-container"></div>

  <!-- 前景捲動文字內容 -->
  <div class="scroll-container">
    <section class="page-section">
      <div class="text-box">
        <h1>歡迎來到我的空間</h1>
        <p>這是我用 AI 生成的 3D 虛擬造型。試著向下滾動網頁，看看會發生什麼事？</p>
      </div>
    </section>
    
    <section class="page-section">
      <div class="text-box">
        <h1>關於我的作品</h1>
        <p>當網頁往下捲動時，背景的模型會自動轉向側面，帶出流暢的網頁互動體驗。</p>
      </div>
    </section>
    
    <section class="page-section">
      <div class="text-box">
        <h1>聯絡我</h1>
        <p>模型現在轉到了背面。不論往上或往下捲動，動態效果都會完美同步！</p>
      </div>
    </section>
  </div>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    // 1. 初始化 Three.js 環境
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 2.5); // 設定鏡頭遠近

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // 2. 設置場景自然光照
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
    scene.add(ambientLight);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
    directionalLight.position.set(5, 5, 5);
    scene.add(directionalLight);

    let model;

    // 3. 配置 Draco 解碼器（直接使用 jsdelivr 的開源本地節點，徹底避開 CORS 阻擋問題）
    const dracoLoader = new THREE.DRACOLoader();
    dracoLoader.setDecoderPath('https://jsdelivr.net');

    // 4. 將解碼器掛載到 GLTF 載入器上
    const loader = new THREE.GLTFLoader();
    loader.setDRACOLoader(dracoLoader);

    // 5. 載入您的 123zip.glb 模型檔案
    loader.load('123zip.glb', (gltf) => {
      model = gltf.scene;
      model.position.set(0, -0.6, 0); // 調整模型在畫面上的上下位置
      scene.add(model);

      // 6. 綁定網頁滾動動畫（全模型隨捲動轉身）
      gsap.to(model.rotation, {
        y: Math.PI, // 捲動到最底部時剛好旋轉 180 度到背面
        scrollTrigger: {
          trigger: ".scroll-container",
          start: "top top",
          end: "bottom bottom",
          scrub: 1
        }
      });
    }, undefined, (error) => { console.error('3D 模型載入發生錯誤：', error); });

    // 7. 動態渲染迴圈
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();

    // 8. 響應式視窗縮放
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
