<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>我的線上作品集</title>
  <link rel="stylesheet" href="styles.css" />
  <meta name="description" content="我的特色線上作品集 — 含 3D 模型與捲動互動" />
</head>
<body>
  <!-- 固定放 3D 的區塊 -->
  <div id="scene" aria-hidden="true"></div>

  <!-- 頁首 / Hero -->
  <header class="hero">
    <div class="hero-inner">
      <h1>我的作品集</h1>
      <p>捲動頁面來旋轉我的 Q 版 3D 模型</p>
      <a class="cta" href="#projects">查看作品</a>
    </div>
  </header>

  <main>
    <section id="about" class="panel">
      <h2>About / 關於我</h2>
      <p>這裡寫你的自我介紹、技能摘要、與設計/創作方向。</p>
    </section>

    <section id="projects" class="panel">
      <h2>Projects / 作品</h2>
      <div class="cards">
        <article class="card">
          <img src="assets/sample-1.jpg" alt="作品範例 1" />
          <h3>作品名稱 1</h3>
          <p>作品描述（可放短文、技術標註、工具等）。</p>
        </article>

        <article class="card">
          <img src="assets/sample-2.jpg" alt="作品範例 2" />
          <h3>作品名稱 2</h3>
          <p>作品描述（可放短文、技術標註、工具等）。</p>
        </article>

        <article class="card">
          <img src="assets/sample-3.jpg" alt="作品範例 3" />
          <h3>作品名稱 3</h3>
          <p>作品描述（可放短文、技術標註、工具等）。</p>
        </article>
      </div>
    </section>

    <section id="contact" class="panel">
      <h2>Contact / 聯絡我</h2>
      <p>Email: yourname@example.com</p>
      <p>在此放社群連結或下載履歷的按鈕。</p>
    </section>
  </main>

  <footer class="footer">
    <small>© 2026 你的名字</small>
  </footer>

  <script type="module" src="script.js"></script>
</body>
</html>
