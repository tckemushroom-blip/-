<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的 3D 滾動個人網站</title>
  
  <!-- 1. 引入正確完整的 Google 官方 3D 檢視器載入腳本 -->
  <script type="module" src="https://googleapis.com"></script>
  
  <!-- 2. 引入正確完整的 GSAP 動畫庫與滾動觸發外掛 -->
  <script src="https://cloudflare.com"></script>
  <script src="https://cloudflare.com"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      background-color: #0d0d11;
      color: #ffffff;
      font-family: sans-serif;
      overflow-x: hidden;
    }
    
    /* 背景 3D 模型固定滿版 */
    model-viewer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
      --poster-color: transparent;
    }

    .scroll-container {
      position: relative;
      z-index: 2;
    }

    .page-section {
      height: 100vh;
      display: flex;
      align-items: center;
      padding: 0 8%;
      box-sizing: border-box;
    }

    .page-section:nth-child(even) {
      justify-content: flex-end;
    }

    .text-box {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 40px;
      border-radius: 16px;
      max-width: 400px;
    }

    h1 { margin: 0 0 15px 0; font-size: 2.5rem; color: #00fff2; }
    p { margin: 0; font-size: 1.1rem; line-height: 1.6; color: #ccc; }
  </style>
</head>
<body>

  <!-- 3. 補上完整合法的 Google Draco 線上解碼器網址 (包含後方的斜線 / 缺一不可) -->
  <model-viewer 
    id="my-avatar" 
    src="123zip.glb" 
    draco-decoder-path="https://gstatic.com"
    shadow-intensity="1" 
    environment-image="neutral"
    camera-orbit="0deg 75deg 2.5m">
  </model-viewer>

  <!-- 前景捲動內容 -->
  <div class="scroll-container">
    <section class="page-section">
      <div class="text-box">
        <h1>歡迎來到我的空間</h1>
        <p>這是我用 AI 生成的 3D 虛擬造型。試著向下滾動網頁，看看會發生什麼事？</p>
      </div>
    </section>
    
    <section class="page-section">
      <div class="text-box">
        <h1>關於我的作品</h1>
        <p>當網頁往下捲動時，背景的模型會自動轉向側面，帶出流暢的網頁互動體驗。</p>
      </div>
    </section>
    
    <section class="page-section">
      <div class="text-box">
        <h1>聯絡我</h1>
        <p>模型現在轉到了背面。不論往上或往下捲動，動態效果都會完美同步！</p>
      </div>
    </section>
  </div>

  <script>
    gsap.registerPlugin(ScrollTrigger);
    const model = document.querySelector('#my-avatar');

    // 建立與滾動綁定的動畫
    const tl = gsap.timeline({
      scrollTrigger: {
        trigger: ".scroll-container",
        start: "top top",
        end: "bottom bottom",
        scrub: 1
      }
    });

    // 滾動時改變模型的 camera-orbit 角度
    tl.to(model, { attr: { "camera-orbit": "90deg 75deg 2.5m" }, ease: "none" })
      .to(model, { attr: { "camera-orbit": "180deg 75deg 2.5m" }, ease: "none" });
  </script>
</body>
</html>
