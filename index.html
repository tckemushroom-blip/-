<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>我的線上作品集</title>
  <link rel="stylesheet" href="styles.css" />
  <meta name="description" content="我的特色線上作品集 — 含 3D 模型與捲動互動" />

  <!-- Import map: 讓瀏覽器在遇到 bare import 'three' 時能解析到 CDN 的 module 檔 -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.154.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <!-- 固定放 3D 的區塊 -->
  <div id="scene" aria-hidden="true"></div>

  <!-- 頁首 / Hero -->
  <header class="hero">
    <div class="hero-inner">
      <h1>我的作品集</h1>
      <p>捲動頁面來旋轉我的 Q 版 3D 模型</p>
      <a class="cta" href="#projects">查看作品</a>
    </div>
  </header>

  <main>
    <section id="about" class="panel">
      <h2>About / 關於我</h2>
      <p>這裡寫你的自我介紹、技能摘要、與設計/創作方向。</p>
    </section>

    <section id="projects" class="panel">
      <h2>Projects / 作品</h2>
      <div class="cards">
        <article class="card">
          <!-- 使用線上佔位圖避免 404（你之後可以上傳實際圖片到 assets/ 並還原路徑） -->
          <img src="https://placehold.co/600x400?text=Sample+1" alt="作品範例 1" />
          <h3>作品名稱 1</h3>
          <p>作品描述（可放短文、技術標註、工具等）。</p>
        </article>

        <article class="card">
          <img src="https://placehold.co/600x400?text=Sample+2" alt="作品範例 2" />
          <h3>作品名稱 2</h3>
          <p>作品描述（可放短文、技術標註、工具等）。</p>
        </article>

        <article class="card">
          <img src="https://placehold.co/600x400?text=Sample+3" alt="作品範例 3" />
          <h3>作品名稱 3</h3>
          <p>作品描述（可放短文、技術標註、工具等）。</p>
        </article>
      </div>
    </section>

    <section id="contact" class="panel">
      <h2>Contact / 聯絡我</h2>
      <p>Email: yourname@example.com</p>
      <p>在此放社群連結或下載履歷的按鈕。</p>
    </section>
  </main>

  <footer class="footer">
    <small>© 2026 你的名字</small>
  </footer>

  <!-- status overlay for 3D model load/debug -->
  <div id="model-status" aria-hidden="true" style="position:fixed;bottom:12px;left:12px;padding:8px 12px;background:rgba(0,0,0,0.6);color:#fff;border-radius:6px;font-family:system-ui;font-size:13px;z-index:9999;pointer-events:none;">3D model: initializing...</div>

  <script type="module" src="script.js"></script>
</body>
</html>
